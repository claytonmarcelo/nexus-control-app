# Nginx do frontend: serve o bundle estatico do Vite com fallback de SPA e
# faz proxy reverso de /api para o servico "backend" do docker-compose.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Qualquer chamada a /api e encaminhada ao backend (mesma porta do browser,
    # sem CORS). Inclui /api/pedidos, /api/pagamentos/webhook etc.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health do backend tambem fica disponivel pelo host do frontend.
    location = /health {
        proxy_pass http://backend:3000/health;
    }

    # Fallback de SPA: rotas do React Router (ex.: /usuarios) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
