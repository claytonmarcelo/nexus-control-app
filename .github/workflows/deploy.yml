name: 🚀 Deploy para AWS Academy / Produção

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci-and-deploy:
    name: 🧪 Build & Testes & Deploy
    runs-on: ubuntu-latest

    # Os segredos são expostos aqui (contexto `secrets` é permitido em jobs.<job_id>.env)
    # para que o passo de deploy possa ser condicionado via `if: env.*` — o contexto
    # `secrets` NÃO é permitido em `jobs.<job_id>.steps.<step_id>.if`.
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: nexusdb_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Test & Build
      - name: 📦 Instalar dependências Backend
        working-directory: ./backend
        run: npm ci

      - name: 🔧 Configurar ambiente de testes
        working-directory: ./backend
        run: |
          cp .env.test.example .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASS=test" >> .env
          echo "DB_NAME=nexusdb_test" >> .env
          echo "NODE_ENV=test" >> .env

      - name: 🏗️ Compilar Backend
        working-directory: ./backend
        run: npm run build

      - name: 🗃️ Preparar banco de testes
        working-directory: ./backend
        run: |
          npm run db:migrate
          npm run db:seed

      - name: 🧪 Executar testes do Backend
        working-directory: ./backend
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: test
          DB_NAME: nexusdb_test
          NODE_ENV: test

      # Frontend Test & Build
      - name: 📦 Instalar dependências Frontend
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: 🧪 Executar testes Frontend
        working-directory: ./frontend
        run: npm test

      - name: 🏗️ Compilar Frontend para Produção
        working-directory: ./frontend
        run: npm run build

      # Deploy Condicional via SSH (só roda quando EC2_HOST e EC2_SSH_KEY existem)
      #
      # A execução usa o MESMO script do caminho documentado (deploy-aws.sh) para que
      # CI e atualização manual na EC2 não divirjam. O script já trata de: git
      # fetch/reset, npm ci com devDependencies (necessário porque o build roda `tsc`,
      # que é devDependency), build do backend, migrações + seed idempotentes via
      # `node dist/utils/*.js`, poda de devDependencies, build do frontend, sync com
      # Nginx, `pm2 reload --env production` e health check em /api/health.
      # Qualquer falha faz o passo fechar com erro em vez de deixar o serviço no ar
      # com código antigo.
      - name: 🚀 Deploy na AWS EC2 (via SSH)
        if: ${{ env.EC2_HOST != '' && env.EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER != '' && env.EC2_USER || 'ubuntu' }}
          key: ${{ env.EC2_SSH_KEY }}
          port: ${{ env.EC2_PORT != '' && env.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=== Atualizando Nexus Control na AWS EC2 ==="

            APP_DIR=""
            for CANDIDATE in "$HOME/nexus-control-app" /home/ubuntu/nexus-control-app /var/www/nexus-control-app; do
              if [ -f "$CANDIDATE/deploy-aws.sh" ]; then
                APP_DIR="$CANDIDATE"
                break
              fi
            done

            if [ -z "$APP_DIR" ]; then
              echo "❌ deploy-aws.sh não encontrado em nenhum diretório conhecido."
              echo "   Clone o repositório em ~/nexus-control-app antes do primeiro deploy:"
              echo "   git clone <repo> ~/nexus-control-app"
              exit 1
            fi

            echo "📍 Diretório da aplicação: $APP_DIR"
            cd "$APP_DIR"
            bash deploy-aws.sh
            echo "=== Deploy concluído com sucesso! ==="
